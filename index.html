  const named = new RegExp(namedSrc, 'g');
  const spans = []; let m;
  while ((m = named.exec(text))) {
    const unit = (m[4] === 'Ω' || m[4].toLowerCase() === 'ohm') ? 'Ω' : m[4];
    const val = parseFloat(m[2].replace(',', '.')) * (m[3] ? SI[m[3]] : 1);
    if (!(m[1] in knowns)) { givens.push({ name:m[1], value:val, unit, kind:KIND[unit] || '' }); knowns[m[1]] = val; }
    spans.push([m.index, m.index + m[0].length]);
  }
  const anon = /(\d+(?:[.,]\d+)?)\s*([pnuµμmkKMG]?)\s*(Ω|Ω|ohm|V|A|W)(?![A-Za-z0-9_])/g;
  const seen = new Set(givens.map(g => g.value + g.unit));
  while ((m = anon.exec(text))) {
    if (spans.some(([a, b]) => m.index >= a && m.index < b)) continue;
    const prev = text[m.index - 1]; if (prev && /[A-Za-z0-9_.]/.test(prev)) continue;
    const unit = (m[3] === 'Ω' || m[3].toLowerCase() === 'ohm') ? 'Ω' : m[3];
    const val = parseFloat(m[1].replace(',', '.')) * (m[2] ? SI[m[2]] : 1);
    const key = val + unit; if (seen.has(key)) continue; seen.add(key);
    givens.push({ name:null, value:val, unit, kind:KIND[unit] || '' });
  }
  const eqs = [];
  for (const raw of text.split(/\n|;/)) {
    let line = raw.trim(); if (!line) continue;
    const eqCount = (line.match(/=/g) || []).length;
    if (new RegExp(namedSrc).test(line)) {
      const rest = line.replace(new RegExp(namedSrc, 'g'), '').replace(/[,\s.;:]/g, '');
      if (!rest.length) eqLines.add(raw.trim());
      continue;
    }
    if (eqCount !== 1) continue;
    const eqPos = line.indexOf('=');
    const colon = line.lastIndexOf(':', eqPos);
    let label = '';
    if (colon >= 0) { label = line.slice(0, colon).trim(); line = line.slice(colon + 1).trim(); }
    line = line.replace(/^(?:[*•]|-(?=\s))\s*/, '').replace(/^\(?\d+[).]\s+/, '').replace(/[.,]\s*$/, '');
    const [ls, rs] = line.split('=');
    if (!ls || !rs || looksProse(ls) || looksProse(rs)) continue;
    let A, B;
    try { A = parseExpr(ls); B = parseExpr(rs); } catch (e) { continue; }
    const vs = new Set([...varsOf(A), ...varsOf(B)]);
    if (!vs.size) continue;
    if (A.k === 'var' && varsOf(B).size === 0) {
      if (!(A.v in knowns)) { try { const val = ev(B, {}); knowns[A.v] = val; givens.push({ name:A.v, value:val, unit:'', kind:'Bilinen' }); } catch (e) {} }
      eqLines.add(raw.trim()); continue;
    }
    eqs.push({ src: line.trim(), A, B, label }); eqLines.add(raw.trim());
  }
  const given = { ...knowns };
  eqs.forEach(e => {
    e.tex = `${tex(e.A)} = ${tex(e.B)}`;
    const allV = [...varsOf(e.A), ...varsOf(e.B)];
    const SA = subst(e.A, given), SB = subst(e.B, given);
    if (allV.some(v => v in given)) e.substTex = `${tex(SA)} = ${tex(SB)}`;
    const U = [...new Set([...varsOf(SA), ...varsOf(SB)])];
    const lin = U.length ? linearize(env => ev(SA, env) - ev(SB, env), U) : null;
    if (lin) {
      const LT = termsOf(SA), RT = termsOf(SB);
      const dens = [...LT, ...RT].map(t => numDen(t.n));
      let L = 1;
      if (dens.every(d => Number.isInteger(d) && d > 0 && d < 1e6) && dens.some(d => d > 1) && LT.length + RT.length <= 10) {
        L = dens.reduce(lcm, 1); e.lcm = L;
        const side = (arr, fn) => arr.map((t, i) => {
          const k = L / numDen(t.n);
          const sg = t.s < 0 ? (i === 0 ? '-' : ' - ') : (i === 0 ? '' : ' + ');
          return sg + fn(t, k);
        }).join('') || '0';
        e.braceTex = side(LT, (t, k) => r`\underbrace{${tex(t.n)}}_{\times ${k}}`) + ' = ' + side(RT, (t, k) => r`\underbrace{${tex(t.n)}}_{\times ${k}}`);
        e.expTex = side(LT, (t, k) => expandTerm(t.n, k)) + ' = ' + side(RT, (t, k) => expandTerm(t.n, k));
      }
      e.simpTex = linTex(lin.a.map(x => x * L), U, lin.b * L);
    } else if (U.length) e.nonlinear = true;
  });
  // --- çözüm: önce tek bilinmeyenliler, sonra doğrusal sistem ---
  const K = { ...knowns }, solution = {}, log = [], solved = new Set();
  let progress = true, guard = 0, singular = false;
  while (progress && guard++ < 25) {
    progress = false;
    eqs.forEach((e, idx) => {
      if (solved.has(idx)) return;
      const un = [...new Set([...varsOf(e.A), ...varsOf(e.B)])].filter(v => !(v in K));
      if (!un.length) { solved.add(idx); return; }
      if (un.length !== 1) return;
      const u = un[0];
      const g = x => ev(e.A, { ...K, [u]: x }) - ev(e.B, { ...K, [u]: x });
      const x = solve1D(g); if (x === null || !isFinite(x)) return;
      K[u] = x; solution[u] = x; solved.add(idx);
      log.push(`Denklem ${idx + 1} tek bilinmeyenli → $${varTex(u)} = ${fmt(x)}${unitOf(u)}$`);
      progress = true;
    });
    if (progress) continue;
    const rem = eqs.map((_, i) => i).filter(i => !solved.has(i));
    if (!rem.length) break;
    const U = [...new Set(rem.flatMap(i => [...varsOf(eqs[i].A), ...varsOf(eqs[i].B)]))].filter(v => !(v in K));
    if (!U.length || rem.length < U.length) break;
    const rowsL = rem.map(i => linearize(env => ev(eqs[i].A, env) - ev(eqs[i].B, env), U, K));
    if (rowsL.some(x => !x)) break;
    const x = gauss(rowsL.map(q => q.a), rowsL.map(q => q.b));
    if (!x) { singular = true; break; }
    U.forEach((u, j) => { K[u] = x[j]; solution[u] = x[j]; });
    rem.forEach(i => solved.add(i));
    log.push(`Denklem ${rem.map(i => i + 1).join(', ')} birlikte çözüldü (Gauss yok etme, ${U.length} bilinmeyen) → ` + U.map((u, j) => `$${varTex(u)} = ${fmt(x[j])}${unitOf(u)}$`).join(', '));
    progress = true;
  }
  const unknowns = [...new Set(eqs.flatMap(e => [...varsOf(e.A), ...varsOf(e.B)]))].filter(v => !(v in knowns));
  const missing = unknowns.filter(u => !(u in solution));
  const checks = [];
  if (Object.keys(solution).length) eqs.forEach((e, i) => {
    try {
      const terms = termsOf(e.A);
      const vals = terms.map(t => t.s * ev(t.n, K));
      const lhs = ev(e.A, K), rhs = ev(e.B, K);
      const ok = Math.abs(lhs - rhs) <= 1e-6 * (1 + Math.abs(rhs));
      const parts = vals.map((v, j) => j === 0 ? fmt(v, 5) : (v < 0 ? ' - ' + fmt(-v, 5) : ' + ' + fmt(v, 5))).join('');
      checks.push(`Denklem ${i + 1}: $${terms.length > 1 ? parts + ' = ' : ''}${fmt(lhs, 5)}$ , sağ taraf $= ${fmt(rhs, 5)}$ ${ok ? '✅' : '❌'}`);
    } catch (err) {}
  });
  return { givens, knowns, eqs, eqLines, unknowns, missing, solution, log, checks, singular };
}
function numVal(s){
  const a = parseSI(s); if (isFinite(a)) return a;
  try { const n = parseExpr(String(s)); if (varsOf(n).size) return NaN; return ev(n, {}); } catch (e) { return NaN; }
}

const SW = { stroke:'currentColor', strokeWidth:1.8, fill:'none', strokeLinecap:'round', strokeLinejoin:'round' };
const ACC = '#0ea5e9';
function geo(a, b){
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
  const u = [dx / L, dy / L];
  return { u, n:[-u[1], u[0]], m:[(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], vert: Math.abs(dy) > Math.abs(dx) };
}
const pt = (p, u, k, n, j=0) => [p[0] + u[0] * k + (n ? n[0] * j : 0), p[1] + u[1] * k + (n ? n[1] * j : 0)];
const PS = arr => arr.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
function ST({ x, y, t, a='start', size=12, color, weight, italic }){
  const parts = String(t).split(/(_\{[^}]*\}|_[A-Za-z0-9]+)/).filter(Boolean);
  let sh = false; const out = [];
  parts.forEach((p, i) => {
    if (p[0] === '_' && p.length > 1) { const s = p[1] === '{' ? p.slice(2, -1) : p.slice(1); out.push(<tspan key={i} dy={4} fontSize={size * 0.72}>{s}</tspan>); sh = true; }
    else { out.push(<tspan key={i} dy={sh ? -4 : 0}>{p}</tspan>); sh = false; }
  });
  return <text x={x} y={y} textAnchor={a} fontSize={size} fill={color || 'currentColor'} fontWeight={weight ? 700 : 500} fontStyle={italic ? 'italic' : 'normal'} style={{ fontFamily:'Inter, sans-serif' }}>{out}</text>;
}
function Wire({ p, dash, color }){ return <polyline points={p} {...SW} stroke={color || 'currentColor'} strokeDasharray={dash}/>; }
function Dot({ x, y }){ return <circle cx={x} cy={y} r={3.3} fill="currentColor"/>; }
function Term({ x, y, label, side='r' }){
  return <g><circle cx={x} cy={y} r={4.2} className="fill-white dark:fill-slate-900" stroke="currentColor" strokeWidth={1.8}/>
    {label && <ST x={side === 'r' ? x + 10 : x - 10} y={y + 4} t={label} a={side === 'r' ? 'start' : 'end'} size={13} weight/>}</g>;
}
function Ground({ x, y }){
  return <g {...SW}><line x1={x} y1={y} x2={x} y2={y + 8}/><line x1={x - 10} y1={y + 8} x2={x + 10} y2={y + 8}/><line x1={x - 6} y1={y + 12} x2={x + 6} y2={y + 12}/><line x1={x - 2} y1={y + 16} x2={x + 2} y2={y + 16}/></g>;
}
function labelPos(g, lo, defV, defH){
  if (lo) return { x:g.m[0] + lo[0], y:g.m[1] + lo[1], a:lo[2] || 'middle' };
  return g.vert ? { x:g.m[0] + defV[0], y:g.m[1] + defV[1], a:defV[2] } : { x:g.m[0] + defH[0], y:g.m[1] + defH[1], a:defH[2] };

function niceTicks(lo, hi, n=6){
  const span = hi - lo || 1; const raw = span / n; const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * p).find(k => k >= raw) || p * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function PlotFrame({ W, H, pad, xr, yr, xl, yl, children }){

    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto text-slate-600 dark:text-slate-300">

const GMODES = {
  area:   { inN:'i(t) [A]', outN:'q(t) − q(0) [C]', iv:'i', ov:'q', iu:r`\mathrm{A}`, ou:r`\mathrm{C}`, rule:'Alan → integral', def:'0,0; 1,10; 3,10; 4,0; 5,-5; 6,0' },
  slope:  { inN:'q(t) [C]', outN:'i(t) [A]', iv:'q', ov:'i', iu:r`\mathrm{C}`, ou:r`\mathrm{A}`, rule:'Eğim → türev', def:'0,0; 2,4; 4,4; 6,-2; 8,0' },

};
function GraphLab(){
  const [mode, setMode] = useState('area');
  const [txt, setTxt] = useState(GMODES.area.def);
  const [ts, setTs] = useState(3.5);
  const M = GMODES[mode];
  const pts = useMemo(() => {
    const p = txt.split(';').map(s => s.split(',').map(x => parseFloat(x.trim()))).filter(a => a.length === 2 && a.every(isFinite)).sort((a, b) => a[0] - b[0]);
    return p.filter((q, i) => i === 0 || q[0] !== p[i - 1][0]);
  }, [txt]);
  const ok = pts.length >= 2;
  const t0 = ok ? pts[0][0] : 0, t1 = ok ? pts[pts.length - 1][0] : 1;
  const T = Math.min(Math.max(ts, t0), t1);
  const segIdx = t => { for (let k = 0; k < pts.length - 1; k++) if (t <= pts[k + 1][0]) return k; return pts.length - 2; };
  const f = t => { const k = segIdx(t); const [a, fa] = pts[k], [b, fb] = pts[k + 1]; return fa + (fb - fa) * (t - a) / (b - a); };
  const F = t => { let s = 0; for (let k = 0; k < pts.length - 1; k++) { const [a, fa] = pts[k], [b] = pts[k + 1]; if (t <= a) break; const e = Math.min(t, b); s += (fa + f(e)) / 2 * (e - a); } return s; };
  const slopeOf = k => (pts[k + 1][1] - pts[k][1]) / (pts[k + 1][0] - pts[k][0]);
  if (!ok) return <Card className="p-5"><p className="text-rose-500 text-sm">En az iki nokta gir (ör. 0,0; 1,5).</p><input className={inputCls + ' mt-2'} value={txt} onChange={e => setTxt(e.target.value)}/></Card>;

  let outPts, outY;

  else { outPts = Array.from({ length:241 }, (_, i) => { const t = t0 + (t1 - t0) * i / 240; return [t, F(t)]; }); outY = outPts.map(p => p[1]); }
  const yr2 = [Math.min(0, ...outY), Math.max(0, ...outY)]; const d2 = (yr2[1] - yr2[0]) * .12 || 1; yr2[0] -= d2; yr2[1] += d2;
  const k = segIdx(T);
  const area = F(T);
  return (
    <Card className="p-5">
      <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
        <div><h3 className="font-bold">📈 Grafik Okuma Laboratuvarı</h3><p className="text-xs text-slate-500">Parça parça doğrusal bir dalga gir; alan/eğim kuralını canlı gör.</p></div>
        <Seg value={mode} onChange={m => { setMode(m); setTxt(GMODES[m].def); }} options={[{ v:'area', l:'i → q (alan)' }, { v:'slope', l:'q → i (eğim)' }, { v:'energy', l:'p → w (alan)' }]} small/>
      </div>
      <Field label={`${M.inN} noktaları  (t,değer; t,değer; …)`}><input className={inputCls + ' font-mono'} value={txt} onChange={e => setTxt(e.target.value)}/></Field>
      <div className="grid lg:grid-cols-2 gap-4 mt-4">
        <PlotFrame W={W} H={H} pad={pad} xr={[t0, t1]} yr={yr1} xl="t [s]" yl={M.inN}>
          {(sx, sy) => {
            const poly = [[t0, 0], ...pts.filter(p => p[0] < T).map(p => [p[0], p[1]]), [T, f(T)], [T, 0]];
            const ps = poly.map(p => sx(p[0]) + ',' + sy(p[1])).join(' ');
            return <g>
              <defs>
                <clipPath id="gl-pos"><rect x={0} y={0} width={W} height={sy(0)}/></clipPath>
                <clipPath id="gl-neg"><rect x={0} y={sy(0)} width={W} height={H}/></clipPath>
              </defs>
              {mode !== 'slope' && <g><polygon points={ps} fill="#0ea5e9" fillOpacity={.28} clipPath="url(#gl-pos)"/><polygon points={ps} fill="#f43f5e" fillOpacity={.28} clipPath="url(#gl-neg)"/></g>}
              <polyline points={pts.map(p => sx(p[0]) + ',' + sy(p[1])).join(' ')} fill="none" stroke="#0ea5e9" strokeWidth={2.4}/>
              {mode === 'slope' && <line x1={sx(pts[k][0])} y1={sy(pts[k][1])} x2={sx(pts[k + 1][0])} y2={sy(pts[k + 1][1])} stroke="#f59e0b" strokeWidth={5} strokeOpacity={.6} strokeLinecap="round"/>}

              <line x1={sx(T)} x2={sx(T)} y1={pad.t} y2={H - pad.b} stroke="#f59e0b" strokeDasharray="4 3"/>
              <circle cx={sx(T)} cy={sy(f(T))} r={4.5} fill="#f59e0b"/>
            </g>;
          }}
        </PlotFrame>
        <PlotFrame W={W} H={H} pad={pad} xr={[t0, t1]} yr={yr2} xl="t [s]" yl={M.outN}>

function KclDiagram({ rows, unk, x }){

function MaxPowerTool(){
  const [vth, setVth] = useState('9'); const [rth, setRth] = useState('4'); const [k, setK] = useState(0.5);
  const V = numVal(vth), Rt = numVal(rth);
  const ok = isFinite(V) && isFinite(Rt) && Rt > 0;
  const Rmax = 5 * (ok ? Rt : 1);
  const Ro = k * Rmax;
  const P = R => V * V * R / ((Rt + R) * (Rt + R));
  const Pm = ok ? V * V / (4 * Rt) : 0;
  const W = 560, H = 200, pad = { l:50, r:14, t:14, b:26 };
  return (
    <Card className="p-5">
      <h4 className="font-bold mb-3">📊 Maksimum Güç Transferi — Canlı Eğri</h4>
      <div className="grid md:grid-cols-[1fr_1.4fr] gap-5">
        <div className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <Field label="V_th (V)"><input className={inputCls} value={vth} onChange={e => setVth(e.target.value)}/></Field>
            <Field label="R_th (Ω)"><input className={inputCls} value={rth} onChange={e => setRth(e.target.value)}/></Field>
          </div>
          <Field label={`Yük direnci R_o = ${fmt(Ro, 4)} Ω`}><input type="range" className="w-full" min={0.002} max={1} step={0.002} value={k} onChange={e => setK(+e.target.value)}/></Field>
          <TheveninEq vth={`${vth} V`} rth={`${rth} Ω`} ro={`R_o = ${fmt(Ro, 3)} Ω`}/>
        </div>
        <div>
          {ok ? <>
            <PlotFrame W={W} H={H} pad={pad} xr={[0, Rmax]} yr={[0, Pm * 1.15]} xl="R_o [Ω]" yl="P_o [W]">
              {(sx, sy) => { const pts = Array.from({ length:200 }, (_, i) => { const R = Rmax * i / 199; return sx(R) + ',' + sy(P(R)); }).join(' ');
                return <g><polyline points={pts} fill="none" stroke="#0ea5e9" strokeWidth={2.4}/>
                  <line x1={sx(Rt)} x2={sx(Rt)} y1={sy(0)} y2={sy(Pm)} stroke="#10b981" strokeDasharray="4 3"/>
                  <circle cx={sx(Rt)} cy={sy(Pm)} r={5} fill="#10b981"/><text x={sx(Rt) + 8} y={sy(Pm) - 6} fontSize={11} fill="#10b981" fontWeight={700}>P_max</text>
                  <circle cx={sx(Ro)} cy={sy(P(Ro))} r={5} fill="#f59e0b"/></g>; }}
            </PlotFrame>
            <div className="grid grid-cols-2 gap-2 mt-2 text-sm">
              <div className="rounded-lg bg-amber-500/10 px-3 py-2"><Tex m={r`P_o = \left(\frac{${fmt(V)}}{${fmt(Rt)} + ${fmt(Ro, 4)}}\right)^2 \cdot ${fmt(Ro, 4)} = ${fmt(P(Ro), 4)}\ \mathrm{W}`}/></div>
              <div className="rounded-lg bg-emerald-500/10 px-3 py-2"><Tex m={r`P_{max} = \frac{${fmt(V)}^2}{4 \cdot ${fmt(Rt)}} = ${fmt(Pm, 5)}\ \mathrm{W}`}/></div>
              <div className="rounded-lg bg-slate-100 dark:bg-slate-800/60 px-3 py-2">Verim <Tex m={r`\eta = \frac{R_o}{R_{th} + R_o} = ${fmt(100 * Ro / (Rt + Ro), 3)}\%`}/></div>
              <div className="rounded-lg bg-slate-100 dark:bg-slate-800/60 px-3 py-2"><Tex m={r`P_o / P_{max} = ${fmt(100 * P(Ro) / Pm, 3)}\%`}/></div>
            </div>
          </> : <p className="text-rose-500 text-sm">Geçerli V_th ve pozitif R_th gir.</p>}
        </div>
      </div>
    </Card>
  );
}

  const Ne = Math.max(0, a.n - 1 - a.nVs - a.nDepV);

  const best = Me === null || Ne <= Me ? 'node' : 'mesh';
  const bestN = best === 'node' ? Ne : Me;
  const C = [];
  const push = (id, s, why, plan) => C.push({ id, score:Math.max(0, Math.min(100, Math.round(s))), why, plan });
  const rthStep = dep ? r`Bağımlı kaynak var → bağımsız kaynakları öldür, **bağımlı kaynağa dokunma**, $a$–$b$'ye test kaynağı bağla: $R_{th} = V_{ab}/I_{ab}$.`

  const vthStep = r`$V_{th}$'yi açık devre geriliminden bul — **${MNAME[best]}** ile (${bestN} denklem)${a.transformable && !dep ? ' veya kaynak dönüşümüyle sadeleştirerek' : ''}.`;
  // Düğüm
  { const diff = (Me === null ? Ne + 3 : Me) - Ne;
    const why = [r`Düğüm denklemi sayısı: $(${a.n} - 1) - ${a.nVs + a.nDepV} = ${Ne}$`];
    if (a.nIs > a.nVs) why.push('Akım kaynakları KCL denklemine doğrudan girer.');
    if (a.supernode) why.push('Süperdüğüm var → tek KCL + kısıt denklemi yazılacak.');
    if (dep) why.push(r`Bağımlı kaynağın kontrol değişkenini düğüm gerilimleriyle ifade et.`);
    push('node', 60 + 9 * diff + (a.nIs > a.nVs ? 5 : 0) - (a.supernode ? 3 : 0) + (a.goal === 'all' ? 12 : a.goal === 'branch' ? 2 : -18), why,
      [r`Referans düğümü seç (en çok elemanlı düğüm).`, r`${Ne} bilinmeyen düğüm gerilimine KCL yaz (çıkan +).`, ...(a.supernode ? [r`Süperdüğüm: kaynak dışındaki dallar için tek KCL + $V_+ - V_- = V_s$.`] : []), r`Paydaları EKOK ile eşitle, sistemi çöz.`, r`Tellegen ile sağla: $\sum P = 0$.`]); }
  // Çevre
  if (Me === null) push('mesh', 5, ['Devre düzlemsel değil → Ç.A.Y doğrudan uygulanamaz.'], []);
  else { const diff = Ne - Me;
    const why = [r`Çevre denklemi sayısı: $${a.m} - ${a.nIs + a.nDepI} = ${Me}$`];
    if (a.nVs > a.nIs) why.push('Gerilim kaynakları KVL denklemine doğrudan girer.');
    if (a.supermesh) why.push('Ortak kolda akım kaynağı → süperçevre + kısıt denklemi.');
    push('mesh', 60 + 9 * diff + (a.nVs > a.nIs ? 5 : 0) - (a.supermesh ? 3 : 0) + (a.goal === 'all' ? 12 : a.goal === 'branch' ? 2 : -18), why,
      [r`Her göze saat yönünde çevre akımı ata.`, ...(a.nIs ? [r`Dış koldaki akım kaynakları → o çevre akımı doğrudan bilinir.`] : []), ...(a.supermesh ? [r`Süperçevre: $I_a - I_b = I_s$ + kaynağı atlayan dış çevrede KVL.`] : []), r`${Me} çevre için KVL yaz, ortak dallarda $(I_1 - I_2)$.`, r`Tellegen ile sağla.`]); }
  // Kaynak dönüşümü
  push('source', a.transformable ? 52 + (a.goal === 'branch' ? 22 : 0) + (a.goal === 'equiv' || a.goal === 'maxpower' ? 8 : 0) - (dep ? 18 : 0) - (a.goal === 'all' ? 25 : 0) : 12,
    a.transformable ? ['Seri R’li gerilim / paralel R’li akım kaynakları var → zincirleme sadeleşme mümkün.', ...(dep ? ['Bağımlı kaynak var: kontrol değişkeninin bulunduğu elemanı dönüştürme!'] : [])] : ['Kaynaklarla seri/paralel direnç yapısı yok → dönüşüm uygulanamıyor.'],
    [r`Gerilim kaynağı + seri $R$ ⇄ akım kaynağı ∥ $R$ dönüşümlerini uygula.`, r`Paralel akım kaynaklarını ve paralel dirençleri birleştir.`, r`Aranan dala kadar tekrarla; son adımda bölücü / Ohm.`]);
  // Thévenin
  const thS = a.goal === 'equiv' ? 96 : a.goal === 'maxpower' ? 88 : a.goal === 'branch' ? 48 + (a.varLoad ? 38 : 0) + (Ne + (Me ?? Ne) >= 4 ? 8 : 0) : a.goal === 'each' ? 12 : 18;
  push('thevenin', thS, [a.goal === 'equiv' ? 'Soru doğrudan eşdeğer devre istiyor.' : a.varLoad ? 'Yük değişken → bir kez Thévenin bul, her yük için tek satırda çöz.' : 'Tek dal sorulduğunda devrenin geri kalanını eşdeğerle değiştirmek hızlı olabilir.', dep ? 'Bağımlı kaynak → R_th için test kaynağı yöntemi.' : 'Yalnız bağımsız kaynak → R_th kaynak öldürmeyle.'],
    [r`Yükü çıkar, $a$–$b$ uçlarını belirle.`, vthStep, rthStep, r`Norton: $I_N = V_{th}/R_{th}$.`, r`Sağlama: $R_{th} = V_{oc}/I_{sc}$.`]);
  // Maksimum güç
  if (a.goal === 'maxpower') push('maxpower', 98, ['Soru R_o üzerindeki maksimum gücü istiyor → Thévenin eşdeğeri + R_o = R_th.'],
    [r`Yükü ($R_o$) çıkar, $a$–$b$ uçlarını belirle.`, vthStep, rthStep, r`$R_o = R_{th}$ seç, $P_{max} = \dfrac{V_{th}^2}{4R_{th}}$.`, r`Sınır kontrolü: $R_o \to 0$ ve $R_o \to \infty$ için $P_o \to 0$.`]);
  // Süperpozisyon

      if (dep) { s -= 14; why.push('Bağımlı kaynak var → her alt devrede devrede kalacak (alt devreler sadeleşmeyebilir).'); }
      why.unshift(`${nInd} bağımsız kaynak → ${nInd} alt devre çözülecek.`);
    }
    push('super', s, why, [r`Her seferinde yalnız bir bağımsız kaynağı aktif bırak (diğer V → kısa, I → açık).`, ...(dep ? [r`Bağımlı kaynakları **her** alt devrede tut.`] : []), r`Her alt devrede istenen büyüklüğü bul, cebirsel topla.`, r`Gücü en son, toplam akım/gerilimden hesapla.`]); }

function detectTopics(text){
  const low = text.toLowerCase();
  const sc = TOPICS.map(t => ({ ...t, s: t.kw.reduce((a, k) => a + (low.includes(k) ? 1 : 0), 0) })).filter(t => t.s > 0).sort((a, b) => b.s - a.s);
  const dep = /bağımlı|dependent|\bi_?x\b|\bv_?x\b|vcvs|ccvs|vccs|cccs/i.test(text);
  return { list: sc, dep };
}
function methodSteps(id, dep){
  const M = METHODS.find(m => m.id === id); if (!M) return [];
  const groups = []; M.steps.forEach(s => { if (s.g || !groups.length) groups.push({ g:s.g || '', steps:[] }); groups[groups.length - 1].steps.push(s); });
  let use = groups;
  if (id === 'thevenin') use = groups.filter((g, i) => dep ? i === 1 : i === 0);
  return use;
}
function equationsMarkdown(an){

  an.eqs.forEach((e, i) => {
    md += `\n### Denklem ${i + 1}${e.label ? ' — ' + e.label : ''}\n\n`;
    md += `- Yazılan form:\n\n$$${e.tex}$$\n\n`;
    if (e.substTex) md += `- Verilenler yerine konunca:\n\n$$${e.substTex}$$\n\n`;
    if (e.braceTex) md += `- Ortak payda: **EKOK = ${e.lcm}** (çarpım katsayıları terimlerin altında):\n\n$$${e.braceTex}$$\n\n$$${e.expTex}$$\n\n`;
    if (e.simpTex) md += `- Düzenlenmiş (doğrusal) form:\n\n$$${e.simpTex}$$\n\n`;
    if (e.nonlinear) md += `- ℹ️ Doğrusal olmayan denklem — sayısal (Newton) çözüm uygulanır.\n\n`;
  });
  return md;
}
function solutionMarkdown(an){
  let md = '';
  if (an.log.length) md += an.log.map(l => `- ${l}`).join('\n') + '\n\n';
  const keys = Object.keys(an.solution);
  if (keys.length) md += '$$' + keys.map(k => r`\boxed{${varTex(k)} = ${fmt(an.solution[k])}${unitOf(k)}}`).join(r`\qquad `) + '$$\n\n';

  if (an.singular) md += `> ⚠️ **Tekil sistem:** Denklemler birbirine bağımlı (biri diğerlerinin kombinasyonu). Farklı bir düğüm/çevre için denklem yaz.\n\n`;
  return md;
}
function buildLocalCard(text, title){

  md += `## 1. Verilenler\n\n`;
  if (an.givens.length) {

    an.givens.forEach(g => { md += `| ${g.name ? '$' + varTex(g.name) + '$' : '—'} | $${g.unit ? unitTex(g.value, g.unit) : fmt(g.value)}$ | ${g.kind || ''} |\n`; });
    md += '\n';
  } else md += `*Metinde birimli değer bulunamadı (ör. \`R1 = 90 Ω\`, \`Vs = 180 V\`).*\n\n`;
  // 2. Algoritma

  const ids = list.length ? list.slice(0, 2).map(t => t.id).filter(id => METHODS.some(m => m.id === id)) : [];

    ids.forEach((id, k) => {
      if (k > 0) md += `\n**Ek olarak — ${MNAME[id]}:**\n\n`;
      methodSteps(id, dep).slice(0, k > 0 ? 1 : 9).forEach(g => {
        if (g.g) md += `\n**${g.g}**\n\n`;
        g.steps.forEach((s, i) => { md += `${i + 1}. ${s.t.replace(/\n/g, ' ')}${s.eq ? '\n\n   $$' + s.eq + '$$\n' : ''}\n`; });
      });
    });
  } else {
    md += `1. Bilinmeyenleri belirle ve referans yönlerini işaretle.\n2. Düğümlerde KCL (çıkan +), çevrelerde KVL (önce + uç = +v) yaz.\n3. Eleman bağıntılarını (Ohm, kaynak tanımları) ekle ve sistemi çöz.\n4. Pasif işaretleme ile güçleri hesapla, $\\sum P = 0$ kontrol et.\n`;

  if (dep) warns.push(r`**Bağımlı kaynak:** Thévenin/süperpozisyonda bağımlı kaynak **kapatılmaz**; kaynak dönüşümünde kontrol değişkeni kaybolmamalı.`);
  warns.push(r`**Pasif işaretleme:** güç işaretini akımın **girdiği kutba** göre belirle — kaynak da güç alabilir.`);
  [...new Set(warns)].slice(0, 6).forEach(w => { md += `> ⚠️ **Kritik Uyarı:** ${w}\n\n`; });
  // 4. Denklemler
  md += `## 4. Adım Adım Denklem Kurulumu\n`;
  if (an.eqs.length) md += equationsMarkdown(an);
  else md += `\n*Metinde çözülebilir denklem bulunamadı.* Denklemleri ayrı satırlara \`KCL A: (V_A - Vs)/R1 + V_A/R2 = Is\` biçiminde yazarsan terim kaynakları, EKOK katsayıları ve çözüm otomatik eklenir.\n\n`;
  // 5. Çözüm
  md += `## 5. Çözüm\n\n`;
  md += an.eqs.length ? solutionMarkdown(an) : '*Denklem girilmedi.*\n\n';
  const find = re => Object.keys(K).find(k => re.test(k));
  const kv = find(/^V_?th$/i), kr = find(/^R_?th$/i);

  }
  // 6. Sağlama
  md += `## 6. Sağlama\n\n`;
  if (an.checks.length) md += `**Denklemlere geri koyma:**\n\n` + an.checks.map(c => `- ${c}`).join('\n') + '\n\n';
  md += `- **Tellegen:** Tüm elemanların $V$ ve $I$ değerlerini pasif işaretlemeyle yaz; $\\sum P_{üretilen} = \\sum P_{harcanan}$ olmalı → *Modül 5 tablosu*.\n`;
  md += `- **Sınır durumu:** ${LIMITS[primary.id] || LIMITS.node}\n\n`;
  // 7. Eksik adımlar

  md += '\n---\n*Bu kart yerel kural tabanlı motorla üretildi. Görsel/PDF okumak veya serbest metni yorumlatmak için “Gemini AI” modunu kullan.*\n';

async function callGemini({ key, model, text, files }){
  const parts = [{ text: text || 'Ekteki çalışma yaprağını/notları analiz et ve özet karta dönüştür.' }];
  files.forEach(f => parts.push({ inline_data:{ mime_type:f.type, data:f.b64 } }));
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
  const res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ system_instruction:{ parts:[{ text: SYSTEM_PROMPT + FORMAT_ADDENDUM }] }, contents:[{ role:'user', parts }], generationConfig:{ temperature:0.3 } }) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + res.status));
  const out = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts || []).map(p => p.text || '').join('');
  if (!out) throw new Error('Model boş yanıt döndürdü.');
  return out;
}

function OhmCalc(){
  const [f, setF] = useState({ V:'12', I:'', R:'4k', P:'' });
  const n = Object.fromEntries(Object.entries(f).map(([k, v]) => [k, v.trim() === '' ? NaN : numVal(v)]));
  const known = ['V', 'I', 'R', 'P'].filter(k => isFinite(n[k]));
  let out = null, how = '';
  if (known.length >= 2) {
    const [a, b] = known; const s = a + b; let { V, I, R, P } = n;
    if (s === 'VI') { R = V / I; P = V * I; how = r`R = \frac{V}{I},\ P = VI`; }
    else if (s === 'VR') { I = V / R; P = V * V / R; how = r`I = \frac{V}{R},\ P = \frac{V^2}{R}`; }
    else if (s === 'VP') { I = P / V; R = V * V / P; how = r`I = \frac{P}{V},\ R = \frac{V^2}{P}`; }
    else if (s === 'IR') { V = I * R; P = I * I * R; how = r`V = IR,\ P = I^2R`; }
    else if (s === 'IP') { V = P / I; R = P / (I * I); how = r`V = \frac{P}{I},\ R = \frac{P}{I^2}`; }
    else if (s === 'RP') { V = Math.sqrt(P * R); I = Math.sqrt(P / R); how = r`V = \sqrt{PR},\ I = \sqrt{P/R}`; }
    out = { V, I, R, P };
  }
  const U = { V:'V', I:'A', R:'Ω', P:'W' };
  return (
    <div className="space-y-3">
      <p className="text-xs text-slate-500">Herhangi <b>iki</b> değeri gir (SI önekli olabilir: 4k, 2.5m, 470µ), diğer ikisi hesaplanır.</p>

        {['V', 'I', 'R', 'P'].map(k => <Field key={k} label={`${k} (${U[k]})`}><input className={inputCls + ' font-mono'} value={f[k]} onChange={e => setF({ ...f, [k]:e.target.value })} placeholder="?"/></Field>)}
      </div>
      {known.length > 2 && <p className="text-xs text-amber-600">İkiden fazla değer girildi; ilk iki ({known.slice(0, 2).join(', ')}) kullanılıyor.</p>}
      {out && <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">{['V', 'I', 'R', 'P'].map(k => <div key={k} className={cx('rounded-xl p-3', known.slice(0, 2).includes(k) ? 'bg-slate-100 dark:bg-slate-800/60' : 'bg-sky-500/10 border border-sky-500/30')}><div className="text-xs text-slate-500">{k}</div><div className="font-bold tabular-nums">{formatSI(out[k], U[k])}</div></div>)}</div>}
      {out && <Tex d m={how}/>}
    </div>
  );
}

function DivCalc(){

  { id:'m5', no:5, t:'Tellegen & Hesap', icon:'⚖️' },
];
class Boundary extends React.Component {
  constructor(p){ super(p); this.state = { e:null }; }
  static getDerivedStateFromError(e){ return { e }; }
  componentDidUpdate(pp){ if (pp.k !== this.props.k && this.state.e) this.setState({ e:null }); }
  render(){ return this.state.e ? <Card className="p-6"><div className="text-rose-500 font-bold">Bu modülde bir hata oluştu</div><pre className="text-xs mt-2 whitespace-pre-wrap">{String(this.state.e && this.state.e.message)}</pre></Card> : this.props.children; }
}
function App(){
  const [tab, setTab] = useState(() => { const h = location.hash.slice(1); return TABS.some(t => t.id === h) ? h : 'm1'; });
  const [method, setMethod] = useState('node');
  const [dark, setDark] = useState(() => document.documentElement.classList.contains('dark'));
  useEffect(() => { document.documentElement.classList.toggle('dark', dark); try { localStorage.setItem('da1_theme', dark ? 'dark' : 'light'); } catch (e) {} }, [dark]);
  useEffect(() => { history.replaceState(null, '', '#' + tab); window.scrollTo({ top:0, behavior:'smooth' }); }, [tab]);
  const goMethod = id => { setMethod(id); setTab('m2'); };
  return (
    <div className="min-h-screen flex flex-col">
      <header className="sticky top-0 z-30 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/75 dark:bg-slate-950/75 backdrop-blur-xl">
        <div className="max-w-7xl mx-auto px-4">
          <div className="flex items-center gap-3 py-3">
            <div className="h-10 w-10 rounded-xl bg-gradient-to-br from-sky-500 to-violet-600 grid place-items-center text-white text-xl shadow-lg shadow-sky-500/25">⚡</div>
            <div className="min-w-0">
              <h1 className="font-extrabold tracking-tight leading-tight truncate">Devre Analizi I <span className="text-sky-600 dark:text-sky-400">· Sınav Atölyesi</span></h1>
              <p className="text-[11px] text-slate-500 truncate">Elektrik-Elektronik Mühendisliği · interaktif ders notu & çalışma aracı</p>
            </div>
            <button onClick={() => setDark(!dark)} className="ml-auto h-10 w-10 rounded-xl border border-slate-300 dark:border-slate-700 grid place-items-center hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Tema değiştir">{dark ? '☀️' : '🌙'}</button>
          </div>
          <nav className="flex gap-1 overflow-x-auto pb-2 -mx-1 px-1">
            {TABS.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={cx('shrink-0 flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-semibold transition',
                  tab === t.id ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800')}>
                <span className={cx('h-5 w-5 rounded-md grid place-items-center text-[10px] font-bold', tab === t.id ? 'bg-sky-500 text-white' : 'bg-slate-200 dark:bg-slate-800')}>{t.no}</span>
                <span>{t.icon} {t.t}</span>
              </button>
            ))}
          </nav>
        </div>
      </header>
      <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        <Boundary k={tab}>
          {tab === 'm1' && <Module1/>}
          {tab === 'm2' && <Module2 method={method} setMethod={setMethod}/>}
          {tab === 'm3' && <Module3 goMethod={goMethod}/>}
          {tab === 'm4' && <Module4/>}
          {tab === 'm5' && <Module5/>}
        </Boundary>
      </main>
      <footer className="border-t border-slate-200 dark:border-slate-800 py-5 text-center text-xs text-slate-500">
        Devre Analizi I · Sınav Atölyesi — React · Tailwind CSS · KaTeX. Notlar ve kartlar yalnızca bu tarayıcıda saklanır. Başarılar! ⚡
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
